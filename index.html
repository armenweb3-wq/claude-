<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d11">
<meta name="color-scheme" content="dark">
<title>Finance</title>
<style>
:root{
  --bg:#070a12;--bg2:#0d1119;--card:#111624;--card2:#18203a;--line:#1d2538;--line2:#2a3450;
  --text:#eef1f8;--muted:#8b94ab;--dim:#596284;
  --accent:#6d8cff;--accent2:#4b6bff;--mint:#3ee6b0;--green:#3ee6b0;--red:#ff5c7a;--amber:#ffb547;--purple:#b48cff;--cyan:#4fd1ff;
  --grad:linear-gradient(135deg,#4b6bff 0%,#7c5cff 55%,#3ee6b0 140%);
  --radius:20px;--tap:48px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(96px + var(--sab));
  background-image:radial-gradient(900px 420px at 50% -120px,rgba(75,107,255,.18),transparent 60%)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600}
h2{font-size:12.5px;margin:24px 0 10px 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
h2 small{font-weight:500;color:var(--dim);font-size:11.5px;margin-left:6px;text-transform:none;letter-spacing:0}
h3{font-size:16px;letter-spacing:-.01em}
p{margin:6px 0}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:12.5px}.xs{font-size:11px}
.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.accent{color:var(--accent)}.purple{color:var(--purple)}
.mono{font-variant-numeric:tabular-nums}
.right{text-align:right}.center{text-align:center}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.gap4{gap:4px}.gap6{gap:6px}.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}.mb10{margin-bottom:10px}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}

/* header */
#top{position:sticky;top:0;z-index:20;background:rgba(7,10,18,.78);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  padding:calc(10px + var(--sat)) 16px 10px}
#top .hbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
#top h1{font-size:21px;letter-spacing:-.02em;font-weight:700}
#top h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.seg{display:inline-flex;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 13px;border-radius:999px;min-height:34px;font-size:13px;font-weight:600;transition:.15s}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(75,107,255,.35)}
.gear{width:40px;height:40px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.gear.on{color:#fff;background:rgba(109,140,255,.2)}
input[type=range]{-webkit-appearance:none;appearance:none;height:28px;background:transparent;padding:0;min-height:0;border:0;width:auto}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-8px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.monthpick{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px}
.monthpick button{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);border-radius:12px;min-width:44px;min-height:38px;font-size:18px}
.monthpick .lbl{min-width:150px;text-align:center;font-weight:700;font-size:15px;letter-spacing:-.01em}
.monthpick .lbl small{display:block;font-weight:500;color:var(--dim);font-size:11px;letter-spacing:.02em}

main{padding:8px 16px 20px;max-width:720px;margin:0 auto;animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* bottom nav (floating) */
#tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--sab));z-index:30;background:rgba(17,22,36,.86);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--line2);border-radius:24px;display:flex;padding:6px;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:696px;margin:0 auto}
#tabs button{flex:1;border:0;background:transparent;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;font-size:10px;font-weight:600;min-height:52px;border-radius:18px;transition:.15s}
#tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:#fff;background:rgba(109,140,255,.18)}
#tabs button.on svg{stroke:var(--accent)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:10px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.card.tight{padding:10px 14px}
.card.flat{background:var(--bg2)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 14px 12px;min-width:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.stat .v{font-size:22px;font-weight:700;margin-top:4px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .d{font-size:11.5px;margin-top:6px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 .stat .v{font-size:16px;letter-spacing:-.01em}
.stat.sm{padding:9px 11px 8px}.stat.sm .v{font-size:15px}.stat.sm .k{font-size:10px}
.hero{position:relative;overflow:hidden;background:var(--grad);border-radius:26px;padding:20px 20px 18px;margin:10px 0;color:#fff;box-shadow:0 18px 50px rgba(75,107,255,.35)}
.hero::before{content:"";position:absolute;inset:-40% -20% auto auto;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.14);filter:blur(10px)}
.hero::after{content:"";position:absolute;left:-60px;bottom:-120px;width:240px;height:240px;border-radius:50%;background:rgba(0,0,0,.18);filter:blur(20px)}
.hero>*{position:relative;z-index:1}
.hero .k{font-size:11.5px;color:rgba(255,255,255,.78);text-transform:uppercase;letter-spacing:.09em;font-weight:600}
.hero .v{font-size:38px;font-weight:800;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums;line-height:1.1}
.hero .v.red{color:#ffd0d8}
.hero .d{font-size:12.5px;color:rgba(255,255,255,.82);margin-top:6px}
.hero .d .green{color:#c9ffe9}.hero .d .red{color:#ffd0d8}.hero .d .dim{color:rgba(255,255,255,.6)}
.hero .mini{display:flex;gap:8px;margin-top:14px}
.hero .mini>div{flex:1;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:9px 10px;min-width:0}
.hero .mini .k{font-size:10px}
.hero .mini b{display:block;font-size:16px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .mini b.red{color:#ffd0d8}
.hero svg.spark{position:absolute;right:18px;top:40px;width:96px;height:36px;opacity:.9}
.hero>.k,.hero>.v{padding-right:104px}
.hero .setup-v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:4px}

/* delta pills */
.dp{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted)}
.dp.up{background:rgba(62,230,176,.14);color:var(--green)}.dp.down{background:rgba(255,92,122,.14);color:var(--red)}
.hero .dp{background:rgba(0,0,0,.22);color:#fff}.hero .dp.up{color:#c9ffe9}.hero .dp.down{color:#ffd0d8}

/* lists */
.list{margin:0;padding:0;list-style:none}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-height:var(--tap)}
.item:last-child{border-bottom:0}
.item .name{font-weight:600;letter-spacing:-.01em}
.item .sub{font-size:12px;color:var(--muted);margin-top:2px}
.item .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.item.off{opacity:.45}
.item.paid .name{color:var(--muted);font-weight:500}
.item.paid .amt{color:var(--muted)}
.av{width:38px;height:38px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
@supports not (color: color-mix(in srgb, red 10%, blue)){.av{background:rgba(109,140,255,.16);color:var(--accent);border-color:rgba(109,140,255,.3)}}
.chip{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.chip.a{color:#a9bcff;border-color:#34457f;background:rgba(109,140,255,.12)}.chip.p{color:#dcc1ff;border-color:#55407e;background:rgba(180,140,255,.12)}.chip.s{color:#9ef0cf;border-color:#2f6b55;background:rgba(62,230,176,.1)}
.chip.red{color:var(--red);border-color:#6b3040;background:rgba(255,92,122,.1)}.chip.amber{color:var(--amber);border-color:#6b5520;background:rgba(255,181,71,.1)}.chip.green{color:var(--green);border-color:#2f6b55;background:rgba(62,230,176,.1)}
.chip.m{color:var(--amber);border-color:#6b5520}.chip.d{color:var(--muted)}

/* checkbox */
.chk{appearance:none;-webkit-appearance:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line2);background:transparent;flex:none;position:relative;margin:0;transition:.15s}
.chk:checked{background:var(--green);border-color:var(--green);box-shadow:0 0 0 4px rgba(62,230,176,.15)}
.chk:checked::after{content:"";position:absolute;left:8px;top:3px;width:7px;height:13px;border:solid #06281c;border-width:0 3px 3px 0;transform:rotate(45deg)}
.chk.big{width:34px;height:34px}.chk.big:checked::after{left:11px;top:5px;width:8px;height:15px}
label.tog{display:flex;align-items:center;gap:10px;min-height:var(--tap);font-size:14px}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line2);position:relative;flex:none;margin:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.sw:checked{background:var(--green)}.sw:checked::after{left:21px}

/* forms */
input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{
  width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:12px 13px;min-height:var(--tap);color:var(--text);outline:none;-webkit-appearance:none;appearance:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(109,140,255,.18)}
input::placeholder{color:var(--dim)}
input.inline{padding:6px 10px;min-height:38px;width:110px;text-align:right;font-variant-numeric:tabular-nums;border-radius:11px}
input.inline.sm{width:64px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
select.inline{padding:6px 28px 6px 10px;min-height:38px;width:auto;font-size:13px;border-radius:11px}
.field{margin:10px 0}.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:rgba(255,255,255,.06);color:var(--text);border-radius:14px;padding:0 16px;min-height:var(--tap);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(75,107,255,.35)}
.btn.danger{color:var(--red);border-color:#5a2a38}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:0 13px;font-size:13px;border-radius:12px}
.btn.xs{min-height:32px;padding:0 10px;font-size:12px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btnrow .btn{flex:1}

/* progress */
.bar{height:8px;background:rgba(255,255,255,.06);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:999px;transition:width .4s ease}
.bar i.g{background:linear-gradient(90deg,#3ee6b0,#4fd1ff)}.bar i.a{background:var(--amber)}.bar i.r{background:var(--red)}
.ring{width:56px;height:56px;flex:none;position:relative}
.ring svg{width:56px;height:56px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .bg{stroke:rgba(255,255,255,.08)}
.ring .fg{stroke:url(#ringGrad);transition:stroke-dashoffset .5s ease}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.cat-bar{display:flex;align-items:center;gap:10px;padding:7px 0}
.cat-bar .lbl{width:38%;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-bar .bar{flex:1}
.cat-bar .amt{width:84px;text-align:right;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
th:first-child,td:first-child{text-align:left}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}

/* review rows */
.rv{padding:11px 0;border-bottom:1px solid var(--line)}
.rv .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rv .merch{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv .ctl{display:flex;gap:6px;margin-top:7px;align-items:center;flex-wrap:wrap}
.rv.dup{opacity:.5}
.rv.del{display:none}
.match{background:rgba(62,230,176,.1);border:1px solid rgba(62,230,176,.3);border-radius:12px;padding:9px 11px;margin-top:8px;font-size:12.5px;display:flex;align-items:center;gap:8px}

/* modal sheet */
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#modal[hidden]{display:none}
#modal .sheet{background:var(--card);border:1px solid var(--line2);border-bottom:0;border-radius:26px 26px 0 0;width:100%;max-width:720px;max-height:88vh;overflow:auto;padding:12px 18px calc(22px + var(--sab));
  -webkit-overflow-scrolling:touch;animation:up .22s cubic-bezier(.2,.8,.2,1)}
#modal .sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#modal .shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#modal .shead h3{font-size:18px;font-weight:700}
#modal .x{border:0;background:rgba(255,255,255,.08);color:var(--text);border-radius:999px;width:36px;height:36px;font-size:18px}
#toast{position:fixed;left:50%;bottom:calc(100px + var(--sab));transform:translateX(-50%) translateY(20px);background:#1b2238;border:1px solid var(--line2);color:var(--text);
  padding:10px 16px;border-radius:14px;font-size:13.5px;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translateX(-50%)}

.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
.leak{border-left:3px solid var(--amber)}
.ins{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.ins:last-child{border-bottom:0}
.ins i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:currentColor;box-shadow:0 0 10px currentColor}
.test{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:flex-start}
.test .ok{color:var(--green);flex:none}.test .fail{color:var(--red);flex:none}
.test .detail{color:var(--muted);font-size:12px;word-break:break-word}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px}
.kv b{font-variant-numeric:tabular-nums;font-weight:700}
.cols{display:flex;gap:10px}
.cols>*{flex:1;min-width:0}
svg.chart{width:100%;height:170px;display:block}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.filetap{display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--line2);border-radius:16px;min-height:76px;color:var(--muted);font-size:14px;position:relative;background:rgba(255,255,255,.03)}
.filetap input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.pill{display:inline-flex;gap:2px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:3px}
.pill button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;min-height:30px}
.pill button.on{background:var(--card2);color:var(--text)}
.step-n{width:28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
@media (min-width:560px){.grid3{gap:10px}.stat .v{font-size:24px}}
</style>
</head>
<body>
<header id="top">
  <div class="hbar">
    <h1>Fin<span>ance</span></h1>
    <div class="row gap6"><div class="seg" id="personSeg">
      <button data-person="Armen">Armen</button>
      <button data-person="Partner">Partner</button>
      <button data-person="both">Both</button>

<script>

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);

/* Parse "1.234,56", "1,234.56", "-12,50", "(12.50)", "€ 1 234,00", "12.50-" → integer cents. Exact (string based). */

/* ---------- CSV ---------- */
function detectDelimiter(text) {

    fixedCosts: [],        // {id,name,amount,category,owner,frequency,active,mandatory,dueDay}
    loans: [],             // {id,name,owner,principal,balance,apr(bp),payment,startDate,term,dueDay}
    payments: {},          // payments[month][itemId] = {paid,paidDate,amount,principal?,interest?,txId?}
    transactions: [],      // {id,person,date,merchant,amount,category,type,statementId,duplicate,linkedTo?}
    categories: [],        // {id,name,type:'mandatory'|'discretionary',keywords:[]}

    snapshots: {},         // snapshots[month] = {assets,debts,netWorth,at}

}

}
let _saveTimer = null;

function lastSavedStr() { if (!S.lastSaved) return 'never'; const d = new Date(S.lastSaved); return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

/* =========================================================
   CALCULATIONS — pure functions over a state-like object `st`
   ========================================================= */
const Calc = {
  share(owner, person) { if (person === 'both') return 1; if (owner === 'Shared') return 0.5; return owner === person ? 1 : 0; },
  applyShare(cents, sh) { return sh === 1 ? cents : sh === 0 ? 0 : Math.round(cents * sh); },
  monthlyShare(fc) { return fc.frequency === 'yearly' ? Math.round(fc.amount / 12) : fc.amount; },
  personList(person) { return person === 'both' ? PEOPLE.slice() : [person]; },

  /* The month's own entry, or salary/other carried forward from the latest earlier month (up to 12 back)

  incomeEntry(st, month, person) {

  txIn(st, month, person) {

  monthTotals(st, month, person, today) {

  /* plain, data-driven observations for the month (no guessing) */

    const od = t.items.filter(i => i.overdue);
    if (od.length) out.push({ level: 'red', text: od.length + ' overdue: ' + od.map(i => i.name).join(', ') + ' (' + fmt(t.overdue) + ')' });
    if (f.dueSoon.length) out.push({ level: 'amber', text: f.dueSoon.length + ' due in the next 7 days: ' + fmt(f.dueSoonTotal) + ' (' + f.dueSoon.map(i => i.name + ' ' + i.dueDay + (i.dueDay === 1 || i.dueDay === 21 || i.dueDay === 31 ? 'st' : i.dueDay === 2 || i.dueDay === 22 ? 'nd' : i.dueDay === 3 || i.dueDay === 23 ? 'rd' : 'th')).join(', ') + ')' });
    if (t.net > 0 && t.leftAfterDue < 0) out.push({ level: 'red', text: 'Spending exceeds income by ' + fmt(-t.leftAfterDue) + ' once all bills are paid' });
    if (f.day >= 7 && f.daysLeft > 0 && tp.discretionary > 0 && f.projectedDiscretionary * 100 > tp.discretionary * 110) out.push({ level: 'amber', text: 'Discretionary on pace for ' + fmt(f.projectedDiscretionary) + ', ' + pct(f.projectedDiscretionary - tp.discretionary, tp.discretionary) + '% above last month' });
    if (f.day >= 7 && f.daysLeft > 0 && tp.discretionary > 0 && f.projectedDiscretionary * 100 < tp.discretionary * 90) out.push({ level: 'green', text: 'Discretionary on pace for ' + fmt(f.projectedDiscretionary) + ', ' + pct(tp.discretionary - f.projectedDiscretionary, tp.discretionary) + '% below last month' });
    if (t.net > 0 && t.savingsRateBp < 1000 && t.savingsRateBp >= 0) out.push({ level: 'amber', text: 'Savings rate ' + bpStr(t.savingsRateBp) + ', under 10% of net income' });
    if (t.net > 0 && t.savingsRateBp >= 2000) out.push({ level: 'green', text: 'Savings rate ' + bpStr(t.savingsRateBp) + ' of net income' });
    const people = Calc.personList(person);
    for (const p of people) { const e = Calc.incomeEntry(st, month, p); if (e.carriedFrom && e.salary) out.push({ level: '', text: N(p) + ': salary carried over from ' + monthLabel(e.carriedFrom) + '. Edit it on Income if it changed.' }); }
    for (const l of st.loans || []) { if (Calc.share(l.owner, person) === 0 || l.balance <= 0) continue; const ls = Calc.loanStats(st, l, today); if (ls.neverEnds) out.push({ level: 'red', text: l.name + ': the payment does not cover the interest' }); else if (ls.termEnd && ls.payoffMonth && ls.payoffMonth > ls.termEnd) out.push({ level: 'amber', text: l.name + ': payoff ' + monthLabel(ls.payoffMonth) + ' is after the term end ' + monthLabel(ls.termEnd) }); }
    for (const g of st.goals || []) { const gs = Calc.goalStats(g, today); if (gs.left > 0 && gs.months > 0 && t.leftover > 0 && gs.perMonth > t.leftover) out.push({ level: 'amber', text: g.name + ' needs ' + fmt(gs.perMonth) + '/month, more than this month\'s leftover ' + fmt(t.leftover) }); if (gs.left > 0 && gs.months === 0 && g.date) out.push({ level: 'red', text: g.name + ': target date reached with ' + fmt(gs.left) + ' still to save' }); }
    return out;
  },
  categorySpend(st, month, person) {
    const o = {};
    for (const t of Calc.txIn(st, month, person)) { if (t.linkedTo) continue; o[t.category || 'Uncategorized'] = (o[t.category || 'Uncategorized'] || 0) + t.amount; }
    return o;
  },

  /* leak detection */
  leaks(st, month, person) {
    const out = [];
    // 1. category spend > 20% above 3-month average
    const cur = Calc.categorySpend(st, month, person);
    const prev = [1, 2, 3].map(n => Calc.categorySpend(st, addMonths(month, -n), person));
    for (const cat of Object.keys(cur)) {
      const hist = prev.map(p => p[cat] || 0); const avg = Math.round(sum(hist) / 3);
      if (avg > 0 && cur[cat] * 100 > avg * 120) out.push({ type: 'category', title: cat + ' is up', detail: fmt(cur[cat]) + ' vs 3-month avg ' + fmt(avg) + ' (+' + pct(cur[cat] - avg, avg) + '%)', amount: cur[cat] - avg });
    }
    // 2. recurring merchants (≥ 2 distinct months in the last 6)
    const win = {}; for (let n = 0; n < 6; n++) { const m = addMonths(month, -n); for (const t of Calc.txIn(st, m, person)) { if (t.linkedTo || t.amount <= 0) continue; const k = patternFromMerchant(t.merchant) || normMerchant(t.merchant); if (!k) continue; const w = win[k] = win[k] || { months: new Set(), total: 0, n: 0, name: t.merchant }; w.months.add(m); w.total += t.amount; w.n++; } }
    const rec = Object.values(win).filter(w => w.months.size >= 2).sort((a, b) => b.total / b.months.size - a.total / a.months.size);
    for (const w of rec.slice(0, 6)) out.push({ type: 'recurring', title: w.name, detail: 'Recurring: ' + w.months.size + ' of last 6 months · avg ' + fmt(Math.round(w.total / w.months.size)) + '/month', amount: Math.round(w.total / w.months.size) });
    // 3. many small charges this month
    const small = {}; for (const t of Calc.txIn(st, month, person)) { if (t.linkedTo || t.amount <= 0 || t.amount > SMALL_CHARGE) continue; const k = patternFromMerchant(t.merchant) || normMerchant(t.merchant); const w = small[k] = small[k] || { n: 0, total: 0, name: t.merchant }; w.n++; w.total += t.amount; }
    for (const w of Object.values(small).filter(w => w.n >= 8).sort((a, b) => b.total - a.total)) out.push({ type: 'small', title: w.name, detail: w.n + ' small charges this month · ' + fmt(w.total) + ' total', amount: w.total });
    return out;
  },

  /* loans */
  interestFor(balance, aprBp) { return Math.round(balance * aprBp / 120000); },
  loanSplit(balance, aprBp, amount) {
    const interest = Math.min(Calc.interestFor(balance, aprBp), Math.max(0, amount));
    const principal = Math.min(Math.max(0, amount - interest), balance);
    return { interest, principal };
  },
  amortize(balance, aprBp, payment, extra, startMonth, maxMonths) {
    extra = extra || 0; maxMonths = maxMonths || 1200; startMonth = startMonth || curMonth();
    const rows = []; let bal = balance, totalInterest = 0, m = startMonth, n = 0, neverEnds = false;
    while (bal > 0 && n < maxMonths) {
      const interest = Calc.interestFor(bal, aprBp);
      const pay = payment + extra;
      if (pay <= interest) { neverEnds = true; break; }
      const principal = Math.min(pay - interest, bal);
      bal -= principal; totalInterest += interest;
      rows.push({ month: m, payment: principal + interest, interest, principal, balance: bal });
      m = addMonths(m, 1); n++;
    }
    if (n >= maxMonths && bal > 0) neverEnds = true;
    return { rows, totalInterest, months: n, payoffMonth: rows.length ? rows[rows.length - 1].month : null, neverEnds, totalPaid: totalInterest + (balance - bal) };
  },
  loanStats(st, loan, today) {
    today = today || todayISO(); const cm = today.slice(0, 7);
    const paidThisMonth = !!(((st.payments || {})[cm] || {})[loan.id] || {}).paid;
    const start = paidThisMonth ? addMonths(cm, 1) : cm;
    const base = Calc.amortize(loan.balance, loan.apr, loan.payment, 0, start);
    let interestPaid = 0, principalPaid = 0, paymentsMade = 0;
    for (const m of Object.keys(st.payments || {})) { const r = st.payments[m][loan.id]; if (r && r.paid) { interestPaid += r.interest || 0; principalPaid += r.principal || 0; paymentsMade++; } }
    const complete = loan.principal > 0 ? (loan.principal - loan.balance) * 10000 / loan.principal : 10000;
    const termEnd = loan.startDate && loan.term ? addMonths(loan.startDate.slice(0, 7), loan.term) : null;
    return { base, interestPaid, principalPaid, paymentsMade, completeBp: Math.round(clamp(complete, 0, 10000)), termEnd, payoffMonth: base.payoffMonth, monthsLeft: base.months, remainingInterest: base.totalInterest, neverEnds: base.neverEnds };
  },
  simulate(loan, extra, startMonth) {
    const base = Calc.amortize(loan.balance, loan.apr, loan.payment, 0, startMonth);
    const sim = Calc.amortize(loan.balance, loan.apr, loan.payment, extra, startMonth);
    return { base, sim, interestSaved: base.totalInterest - sim.totalInterest, monthsSaved: base.months - sim.months };
  },

  /* statement row ↔ due item matching (same month, ±2%) */
  matchPayment(st, tx, person) {
    if (!tx.date || tx.amount <= 0) return null;
    const month = tx.date.slice(0, 7);
    const items = Calc.dueItems(st, month, 'both', tx.date);
    let best = null;
    for (const it of items) {
      const p = it.plannedFull; if (p <= 0) continue;
      const diff = Math.abs(tx.amount - p) * 10000;
      if (diff <= p * MATCH_TOLERANCE_BP) { const score = diff / p; if (!best || score < best.score) best = { item: it, score }; }
    }
    return best ? best.item : null;
  },

  /* categorize a merchant: rules first (longest pattern wins), then category keywords */
  categorize(st, merchant) {
    const nm = normMerchant(merchant); const low = String(merchant || '').toLowerCase();
    const rules = (st.rules || []).slice().sort((a, b) => b.pattern.length - a.pattern.length);
    for (const r of rules) { const p = r.pattern.toLowerCase().trim(); if (p && (nm.includes(p) || low.includes(p))) return { category: r.category, via: 'rule' }; }
    const lr = Calc.learned ? Calc.learned(st, merchant) : null; if (lr) return { category: lr.category, via: 'learned' };
    let best = null;
    for (const c of st.categories || []) for (const k of c.keywords || []) { const kk = k.toLowerCase().trim(); if (kk && (nm.includes(kk) || low.includes(kk)) && (!best || kk.length > best.len)) best = { category: c.name, len: kk.length }; }
    if (best) return { category: best.category, via: 'keyword' };
    return { category: 'Uncategorized', via: 'none' };
  },

  goalStats(goal, today) {
    today = today || todayISO();
    const saved = goal.saved || 0, target = goal.target || 0;
    const left = Math.max(0, target - saved);
    const months = goal.date ? Math.max(0, monthDiff(today.slice(0, 7), goal.date.slice(0, 7))) : 0;
    const perMonth = months > 0 ? Math.ceil(left / months) : left;
    return { saved, target, left, months, perMonth, pctBp: target > 0 ? Math.round(clamp(saved * 10000 / target, 0, 10000)) : 0 };
  }
};

/* =========================================================
   PAYMENTS (per month, per item)
   ========================================================= */
function setPaid(st, month, kind, item, paid, amount, date) {
  st.payments[month] = st.payments[month] || {};
  const prev = st.payments[month][item.id];
  if (kind === 'loan' && prev && prev.paid && prev.principal) item.balance += prev.principal; // undo previous tick
  if (paid) {
    const planned = kind === 'loan' ? item.payment : Calc.monthlyShare(item);
    const amt = amount != null ? amount : planned;
    const rec = { paid: true, paidDate: date || todayISO(), amount: amt };
    if (prev && prev.txId) rec.txId = prev.txId;
    if (kind === 'loan') { const sp = Calc.loanSplit(item.balance, item.apr, amt); rec.interest = sp.interest; rec.principal = sp.principal; item.balance -= sp.principal; }
    st.payments[month][item.id] = rec;
  } else {
    delete st.payments[month][item.id];
    if (!Object.keys(st.payments[month]).length) delete st.payments[month];
  }
}
function paymentHistory(st, item) {
  return Object.keys(st.payments).filter(m => st.payments[m][item.id] && st.payments[m][item.id].paid).sort().reverse().map(m => ({ month: m, rec: st.payments[m][item.id] }));
}

}

function sparkline(vals) { if (vals.length < 2) return ''; const W = 110, H = 40; let mn = Math.min(...vals), mx = Math.max(...vals); if (mx === mn) { mx += 1; mn -= 1; } const pts = vals.map((v, i) => [(i / (vals.length - 1)) * (W - 4) + 2, H - 4 - (v - mn) / (mx - mn) * (H - 8)]); const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' '); const last = pts[pts.length - 1]; return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '"><path d="' + d + '" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="3" fill="#fff"/></svg>'; }

function drawTrend() {

          scales: { x: { grid: { display: false }, ticks: { color: '#8d95a8' } }, y: { grid: { color: '#262c3a' }, ticks: { color: '#8d95a8', callback: v => '€' + (v >= 1000 ? (v / 1000) + 'k' : v) } } } } });

function svgTrend(d) {
  const W = 340, H = 170, padL = 34, padB = 20, padT = 8;
  const series = [['net', '#7c9cff'], ['mandatory', '#f5b64c'], ['discretionary', '#b48cff'], ['leftover', '#3ecf8e']];
  let max = 1, min = 0; for (const x of d) for (const [k] of series) { max = Math.max(max, x[k]); min = Math.min(min, x[k]); }
  const span = max - min || 1; const plotH = H - padB - padT;
  const y = v => padT + (max - v) / span * plotH;
  const gw = (W - padL) / d.length, bw = Math.max(3, (gw - 8) / series.length);
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="6-month trend">';
  const steps = 3; for (let i = 0; i <= steps; i++) { const v = min + span * i / steps; const yy = y(v); s += '<line x1="' + padL + '" x2="' + W + '" y1="' + yy.toFixed(1) + '" y2="' + yy.toFixed(1) + '" stroke="#262c3a" stroke-width="1"/><text x="' + (padL - 4) + '" y="' + (yy + 3).toFixed(1) + '" fill="#8d95a8" font-size="8" text-anchor="end">' + fmtK(Math.round(v)) + '</text>'; }
  d.forEach((x, i) => {
    const gx = padL + i * gw + 4;
    series.forEach(([k, col], j) => { const v = x[k]; const y0 = y(0), y1 = y(v); s += '<rect x="' + (gx + j * bw).toFixed(1) + '" y="' + Math.min(y0, y1).toFixed(1) + '" width="' + (bw - 1).toFixed(1) + '" height="' + Math.max(1, Math.abs(y0 - y1)).toFixed(1) + '" rx="1.5" fill="' + col + '"><title>' + esc(monthShort(x.month)) + ' ' + k + ': ' + fmt(v) + '</title></rect>'; });
    s += '<text x="' + (gx + gw / 2 - 4).toFixed(1) + '" y="' + (H - 6) + '" fill="#8d95a8" font-size="9" text-anchor="middle">' + esc(monthShort(x.month)) + '</text>';
  });
  if (min < 0) s += '<line x1="' + padL + '" x2="' + W + '" y1="' + y(0).toFixed(1) + '" y2="' + y(0).toFixed(1) + '" stroke="#5d6578" stroke-width="1"/>';
  return s + '</svg>';
}

function looksLikeHeader(row) {
  let text = 0; for (const c of row) { const s = String(c).trim(); if (s && parseAmount(s) == null && !parseDate(s)) text++; }
  return text >= Math.max(1, Math.ceil(row.length / 2));
}
function detectMapping(raw) {
  const hasHeader = raw.length > 1 && looksLikeHeader(raw[0]);
  const header = hasHeader ? raw[0].map(s => String(s).trim()) : raw[0].map((_, i) => 'Column ' + (i + 1));
  const body = (hasHeader ? raw.slice(1) : raw).slice(0, 50);
  const n = header.length; const score = [];

    let dates = 0, amts = 0, texts = 0, len = 0, negs = 0, nonEmpty = 0;
    for (const r of body) { const v = String(r[c] == null ? '' : r[c]).trim(); if (!v) continue; nonEmpty++; if (parseDate(v)) dates++; const a = parseAmount(v); if (a != null) { amts++; if (a < 0) negs++; } else if (!parseDate(v)) { texts++; len += v.length; } }
    const hn = header[c].toLowerCase();
    score.push({ c, date: dates / (nonEmpty || 1) + (/date|datum|fecha|data|ημερ|дата|booking|valuta|posted/.test(hn) ? 1 : 0),
      amount: (amts - dates) / (nonEmpty || 1) + (/amount|betrag|importe|montant|ποσό|сумма|value|sum|debit|credit|withdraw|deposit/.test(hn) ? 1 : 0) + (negs ? .2 : 0) + (/credit|deposit/.test(hn) ? -.5 : 0),
      merchant: texts / (nonEmpty || 1) + Math.min(len / (nonEmpty || 1) / 40, .9) + (/desc|merchant|payee|name|narrat|detail|memo|benef|text|particular|reference|counterpart|concept/.test(hn) ? 1 : 0),
      credit: (amts / (nonEmpty || 1)) + (/credit|deposit|einnahme|haben|ingreso/.test(hn) ? 2 : -1) });
  }
  const pick = (k, used) => { let best = null; for (const s of score) { if (used.includes(s.c)) continue; if (!best || s[k] > best[k]) best = s; } return best && best[k] > 0.3 ? best.c : null; };
  const used = [];
  const date = pick('date', used); if (date != null) used.push(date);
  const amount = pick('amount', used); if (amount != null) used.push(amount);
  const merchant = pick('merchant', used); if (merchant != null) used.push(merchant);
  let credit = null; const cr = score.filter(s => !used.includes(s.c) && s.credit > 1.5).sort((a, b) => b.credit - a.credit)[0];
  if (cr && /debit|withdraw|soll|ausgabe/.test(header[amount == null ? -1 : amount].toLowerCase())) credit = cr.c;
  return { hasHeader, header, mapping: { date: date == null ? 0 : date, amount: amount == null ? Math.min(1, n - 1) : amount, merchant: merchant == null ? Math.min(2, n - 1) : merchant, credit: credit, dateFormat: 'auto', sign: 'auto' } };
}
function startReview(text, filename) {

  const bank = ($('#bankName') && $('#bankName').value.trim()) || 'Bank';
  const det = detectMapping(raw);
  const saved = S.bankMappings[bank];
  const mapping = saved && saved.header && saved.header.join('|') === det.header.join('|') ? Object.assign({}, det.mapping, saved) : det.mapping;
  UI.review = { raw, filename, bank, person: UI.stmtPerson, hasHeader: det.hasHeader, header: det.header, mapping, edits: {}, items: [] };

function nameOverlap(merchant, name) {
  const a = new Set(normMerchant(merchant).split(' ').filter(w => w.length >= 3));
  return normMerchant(name).split(' ').some(w => w.length >= 3 && a.has(w));
}
function buildReview() {
  const r = UI.review; const map = r.mapping; const rows = r.hasHeader ? r.raw.slice(1) : r.raw;

}

function saveReview() {
  const r = UI.review; if (!r) return;
  const stmt = { id: uid(), bank: r.bank, filename: r.filename, importedAt: new Date().toISOString(), count: 0, person: r.person, ticked: 0 };
  const newRules = {};
  for (const i of r.items) {
    if (i.deleted || i.skip || !i.valid) continue;
    const tx = { id: uid(), person: r.person, date: i.date, merchant: i.merchant, amount: i.amount, category: i.category, type: i.type, statementId: stmt.id, duplicate: !!i.dup };
    if (i.match && i.tick && !i.dup) {
      const coll = i.match.kind === 'loan' ? S.loans : S.fixedCosts; const item = findById(coll, i.match.id);
      if (item) { setPaid(S, i.date.slice(0, 7), i.match.kind, item, true, i.amount, i.date); S.payments[i.date.slice(0, 7)][item.id].txId = tx.id; tx.linkedTo = item.id; stmt.ticked++; }
    }
    if (i.category !== i.autoCategory && i.category !== 'Uncategorized') { const p = patternFromMerchant(i.merchant); if (p) newRules[p] = i.category; }
    S.transactions.push(tx); stmt.count++;
  }
  for (const p of Object.keys(newRules)) upsertRule(p, newRules[p]);
  S.catRev = (S.catRev || 0) + 1;
  S.statements.push(stmt);
  S.bankMappings[r.bank] = Object.assign({}, r.mapping, { header: r.header, hasHeader: r.hasHeader });
  UI.lastBank = r.bank;
  UI.review = null;
  save(); render();
  toast('Saved ' + stmt.count + ' transactions' + (Object.keys(newRules).length ? ' · learned ' + Object.keys(newRules).length + ' rule(s)' : '') + (stmt.ticked ? ' · ticked ' + stmt.ticked + ' payment(s)' : ''));
}
function upsertRule(pattern, category) {
  pattern = pattern.toLowerCase().trim(); if (!pattern) return;
  const ex = S.rules.find(x => x.pattern.toLowerCase() === pattern);
  if (ex) ex.category = category; else S.rules.push({ id: uid(), pattern, category });
}
function readFileText(file, cb) {
  const fr = new FileReader();
  fr.onload = () => cb(String(fr.result || ''));
  fr.onerror = () => toast('Could not read file');
  fr.readAsText(file);
}

function mergeState(a, b) {
  const ids = coll => new Set((a[coll] || []).map(x => x.id));
  for (const coll of ['fixedCosts', 'loans', 'transactions', 'rules', 'goals', 'statements']) { const have = ids(coll); for (const x of b[coll] || []) if (x && x.id && !have.has(x.id)) a[coll].push(x); }
  const catNames = new Set(a.categories.map(c => c.name)); for (const c of b.categories || []) if (c && !catNames.has(c.name)) a.categories.push(c);
  for (const m of Object.keys(b.income || {})) { a.income[m] = a.income[m] || {}; for (const p of Object.keys(b.income[m])) { if (!a.income[m][p]) a.income[m][p] = b.income[m][p]; else { const have = new Set((a.income[m][p].commissions || []).map(c => c.id)); for (const c of b.income[m][p].commissions || []) if (!have.has(c.id)) a.income[m][p].commissions.push(c); } } }
  for (const m of Object.keys(b.payments || {})) { a.payments[m] = a.payments[m] || {}; for (const id of Object.keys(b.payments[m])) if (!a.payments[m][id]) a.payments[m][id] = b.payments[m][id]; }
  Object.assign(a.bankMappings, b.bankMappings || {});
  return a;
}
function importJsonText(text, mode) {
  let o; try { o = JSON.parse(text); } catch (e) { toast('Not valid JSON'); return false; }
  if (!o || typeof o !== 'object' || !Array.isArray(o.fixedCosts)) { toast('That file is not a Finance export'); return false; }
  if (mode === 'replace') S = Object.assign(blankState(), o);
  else mergeState(S, o);
  S.version = 1; save(); render(); toast('Imported (' + mode + ')'); return true;
}

function runSelfTests() {
  const T = []; const eq = (name, got, want) => T.push({ name, ok: JSON.stringify(got) === JSON.stringify(want), detail: 'got ' + JSON.stringify(got) + ', expected ' + JSON.stringify(want) });
  const near = (name, got, want, tol) => T.push({ name, ok: Math.abs(got - want) <= tol, detail: 'got ' + got + ', expected ' + want + ' ±' + tol });
  const ok = (name, cond, detail) => T.push({ name, ok: !!cond, detail: detail || '' });
  const today = '2026-10-15', M = '2026-10';
  // parsing
  eq('parseAmount: 1.234,56 → 123456', parseAmount('1.234,56'), 123456);
  eq('parseAmount: 1,234.56 → 123456', parseAmount('1,234.56'), 123456);
  eq('parseAmount: -12,50 → -1250', parseAmount('-12,50'), -1250);
  eq('parseAmount: (12.50) → -1250', parseAmount('(12.50)'), -1250);
  eq('parseAmount: "€ 1 234,00" → 123400', parseAmount('€ 1 234,00'), 123400);
  eq('parseAmount: 0.29 → 29 (no float drift)', parseAmount('0.29'), 29);
  eq('parseAmount: 12.50- → -1250', parseAmount('12.50-'), -1250);
  eq('parseAmount: text → null', parseAmount('abc'), null);
  eq('parseDate: 2026-10-03', parseDate('2026-10-03'), '2026-10-03');
  eq('parseDate: 03/10/2026 (DMY default)', parseDate('03/10/2026'), '2026-10-03');
  eq('parseDate: 10/03/2026 MDY hint', parseDate('10/03/2026', 'MDY'), '2026-10-03');
  eq('parseDate: 25.12.26', parseDate('25.12.26'), '2026-12-25');
  eq('parseDate: 3 Oct 2026', parseDate('3 Oct 2026'), '2026-10-03');
  eq('parseDate: invalid 31/02/2026 → null', parseDate('31/02/2026'), null);
  eq('parseCSV: quoted field with comma and ""', parseCSV('a,b\n"x, ""y""",2\n'), [['a', 'b'], ['x, "y"', '2']]);
  eq('parseCSV: semicolon delimiter auto-detected', parseCSV('d;a;m\n01.10.2026;-5,00;Lidl'), [['d', 'a', 'm'], ['01.10.2026', '-5,00', 'Lidl']]);
  eq('addMonths wraps year', [addMonths('2026-12', 1), addMonths('2026-01', -1), addMonths('2026-10', -13)], ['2027-01', '2025-12', '2025-09']);
  eq('monthDiff', monthDiff('2025-11', '2026-10'), 11);
  // shares
  eq('monthlyShare: yearly 600.00 → 50.00', Calc.monthlyShare({ amount: 60000, frequency: 'yearly' }), 5000);
  eq('monthlyShare: yearly 100.00 → 8.33', Calc.monthlyShare({ amount: 10000, frequency: 'yearly' }), 833);
  eq('share: Shared counts ½ for one person, full for Both', [Calc.share('Shared', 'Armen'), Calc.share('Shared', 'both'), Calc.share('Partner', 'Armen')], [0.5, 1, 0]);
  // totals
  const st = fixtureState();
  eq('netIncome Armen = salary+commissions+other', Calc.netIncome(st, M, 'Armen').net, 300000);
  eq('netIncome Both', Calc.netIncome(st, M, 'both').net, 500000);
  const tb = Calc.monthTotals(st, M, 'both', today);
  eq('mandatory (Both) = rent + gym + ins/12 + loan + mandatory tx', tb.mandatory, 120000 + 4000 + 5000 + 30000 + 5000);
  eq('discretionary (Both) excludes duplicates', tb.discretionary, 2850);
  eq('leftover = net − mandatory − discretionary', tb.leftover, 500000 - 164000 - 2850);
  eq('savings rate bp = round(leftover/net)', tb.savingsRateBp, Math.round((500000 - 164000 - 2850) * 10000 / 500000));
  eq('paid so far (Both) = rent', tb.paid, 120000);
  eq('still due (Both) = gym + ins/12 + loan', tb.due, 4000 + 5000 + 30000);
  eq('overdue (today 15th): insurance day10 unpaid; gym 20 & loan 15 not', tb.overdue, 5000);
  eq('left after due = net − (due+paid) − discretionary', tb.leftAfterDue, 500000 - (39000 + 120000) - 2850);
  const ta = Calc.monthTotals(st, M, 'Armen', today);
  eq('Armen: shared rent counted ½ in paid', ta.paid, 60000);
  eq('Armen: due = gym + loan (no Partner insurance)', ta.due, 34000);
  eq('Armen: discretionary only own tx', ta.discretionary, 2500);
  eq('past month: all unpaid are overdue', Calc.monthTotals(st, '2026-09', 'both', today).overdue, 4000 + 5000 + 30000 + 120000);
  const tn = Calc.monthTotals(st, '2026-11', 'both', today);
  eq('future month: nothing of its own overdue; only October\'s carried insurance', [tn.items.filter(i => i.overdue).length, tn.overdue, tn.carried.map(i => i.id)], [0, 5000, ['f3']]);
  // loans
  eq('interest month 1: 5000.00 @ 6% = 25.00', Calc.interestFor(500000, 600), 2500);
  eq('loanSplit: 300.00 payment → 25.00 interest, 275.00 principal', Calc.loanSplit(500000, 600, 30000), { interest: 2500, principal: 27500 });
  eq('loanSplit: never exceeds balance', Calc.loanSplit(1000, 600, 30000), { interest: 5, principal: 1000 });
  const a0 = Calc.amortize(100000, 0, 10000, 0, '2026-10');
  eq('amortize 0% 1000/100 → 10 months, 0 interest, ends Jul 2027', [a0.months, a0.totalInterest, a0.payoffMonth], [10, 0, '2027-07']);
  const a1 = Calc.amortize(100000, 1200, 8885, 0, '2026-01');
  eq('amortize €1000 @12% paying 88.85 → 12 months', a1.months, 12);
  near('amortize total interest ≈ 66.19 (closed form)', a1.totalInterest, 6619, 15);
  ok('amortize: last balance is exactly 0', a1.rows[a1.rows.length - 1].balance === 0);
  ok('amortize: Σprincipal == starting balance', sum(a1.rows, r => r.principal) === 100000);
  const sim = Calc.simulate(st.loans[0], 10000, '2026-10');
  ok('simulator: +100/mo saves interest and months', sim.interestSaved > 0 && sim.monthsSaved > 0, JSON.stringify({ i: sim.interestSaved, m: sim.monthsSaved }));
  const ne = Calc.amortize(100000, 1200, 500, 0, '2026-01');
  ok('amortize: payment below interest → neverEnds', ne.neverEnds);

  /* ---- unpaid bills from earlier months (since tracking started) that are past due ---- */

  addAccount() { S.accounts.push({ id: uid(), name: 'Current account', owner: UI.person === 'both' ? 'Armen' : UI.person, type: 'cash', balance: 0 }); save(); render(); },
  delAccount(el) { S.accounts = S.accounts.filter(a => a.id !== el.dataset.id); save(); render(); },
  addSugg(el) { const s = Calc.recurringCandidates(S, UI.person).find(x => x.pattern === el.dataset.pattern); if (!s) return; const f = { id: uid(), name: s.name.replace(/\s+/g, ' ').trim(), amount: s.amount, category: s.category && s.category !== 'Uncategorized' ? s.category : (S.categories[0] || {}).name || 'Other', owner: UI.person === 'both' ? 'Armen' : UI.person, frequency: 'monthly', active: true, mandatory: catType(s.category) === 'mandatory', dueDay: s.dueDay, startMonth: UI.month, endMonth: '' }; S.fixedCosts.push(f); save(); render(); editFixedModal(f.id); },
  dismissSugg(el) { S.dismissed = S.dismissed || []; S.dismissed.push(el.dataset.pattern); save(); render(); },
  debtMethod(el) { UI.debtMethod = el.dataset.v; render(); },
  whatifReset() { S.whatif = { cuts: {}, extraDebt: 0, incomeDelta: 0 }; save(); render(); },
  runTests() { UI.tests = runSelfTests(); render(); const ok = UI.tests.filter(t => t.ok).length; toast(ok + '/' + UI.tests.length + ' self-tests passed'); }
};

const Changes = {
  togglePaid(el) {
    const item = itemFor(el.dataset.kind, el.dataset.id); if (!item) return; const month = el.dataset.month || UI.month;
    setPaid(S, month, el.dataset.kind, item, el.checked, null, (month === curMonth() || el.dataset.month) ? todayISO() : month + '-' + pad(Math.min(daysInMonth(month), item.dueDay || 1)));
    if (el.checked && S.payments[month] && S.payments[month][item.id]) S.payments[month][item.id].paidBy = item.owner === 'Shared' ? (UI.person === 'both' ? 'Armen' : UI.person) : item.owner;
    save(); render();
    if (el.dataset.modal) (el.dataset.kind === 'loan' ? editLoanModal : editFixedModal)(item.id);
  },
  paidField(el) {
    const item = itemFor(el.dataset.kind, el.dataset.id); const rec = (S.payments[UI.month] || {})[item.id]; if (!item || !rec) return;
    if (el.dataset.field === 'paidDate') { rec.paidDate = el.value || rec.paidDate; }
    else if (el.dataset.field === 'paidBy') { rec.paidBy = el.value; }
    else { const amt = parseAmount(el.value); if (amt == null) { toast('Invalid amount'); return; } setPaid(S, UI.month, el.dataset.kind, item, true, amt, rec.paidDate); }
    save(); render(); (el.dataset.kind === 'loan' ? editLoanModal : editFixedModal)(item.id);
  },
  income(el) {
    const v = parseAmount(el.value); if (v == null) { toast('Invalid amount'); render(); return; }
    const inc = incomeOf(UI.month, el.dataset.person); const cur = Calc.incomeEntry(S, UI.month, el.dataset.person);
    if (cur.carriedFrom) { inc.salary = cur.salary; inc.other = cur.other; }
    inc[el.dataset.field] = v; inc.explicit = true; save(); render();
  },
  commission(el) { const c = findById(incomeOf(UI.month, el.dataset.person).commissions, el.dataset.id); if (!c) return; if (el.dataset.field === 'amount') { const v = parseAmount(el.value); if (v == null) { toast('Invalid amount'); render(); return; } c.amount = v; } else if (el.dataset.field === 'date') c.date = el.value; else c.note = el.value; save(); render(); },
  payday(el) { const v = parseInt(el.value, 10); S.paydays = S.paydays || {}; if (v >= 1 && v <= 31) S.paydays[el.dataset.person] = v; else delete S.paydays[el.dataset.person]; save(); render(); },
  budget(el) { const v = parseAmount(el.value); S.budgets = S.budgets || {}; if (v == null || v <= 0) delete S.budgets[el.dataset.cat]; else S.budgets[el.dataset.cat] = v; save(); render(); },
  whatif(el) { const v = parseAmount(el.value); S.whatif = S.whatif || { cuts: {}, extraDebt: 0, incomeDelta: 0 }; S.whatif[el.dataset.field] = v == null ? 0 : (el.dataset.field === 'extraDebt' ? Math.abs(v) : v); save(); render(); },
  whatifCut(el) { S.whatif = S.whatif || { cuts: {}, extraDebt: 0, incomeDelta: 0 }; S.whatif.cuts[el.dataset.cat] = +el.value; save(); render(); },
  txSearch(el) { UI.txSearch = el.value; render(); },
  startMonth(el) { S.startMonth = /^\d{4}-\d{2}$/.test(el.value) ? el.value : S.startMonth; save(); render(); },
  personName(el) { S.names = S.names || {}; S.names[el.dataset.person] = el.value.trim() || el.dataset.person; save(); render(); },
  field(el) {
    const coll = S[el.dataset.coll]; const it = findById(coll, el.dataset.id); if (!it) return;
    const f = el.dataset.field, t = el.dataset.type || 'text'; let v;
    if (t === 'cents' || t === 'bp') { v = parseAmount(el.value); if (v == null) { toast('Invalid number'); el.value = centsIn(it[f]); return; } if (f !== 'balance' && v < 0) v = -v; }
    else if (t === 'int') { v = parseInt(el.value, 10); if (isNaN(v)) { toast('Invalid number'); return; } if (f === 'dueDay') v = clamp(v, 1, 31); }
    else if (t === 'bool') v = el.checked;
    else if (t === 'list') v = el.value.split(',').map(s => s.trim()).filter(Boolean);
    else v = el.value;
    if ((f === 'startMonth' || f === 'endMonth') && v && !/^\d{4}-\d{2}$/.test(v)) { toast('Use a month like 2026-11'); return; }
    if (el.dataset.coll === 'categories' && f === 'name' && v !== it.name) { const old = it.name; v = v.trim() || old; for (const x of S.transactions) if (x.category === old) x.category = v; for (const x of S.fixedCosts) if (x.category === old) x.category = v; for (const x of S.rules) if (x.category === old) x.category = v; }
    if (el.dataset.coll === 'loans' && f === 'principal' && it.balance === 0 && !paymentHistory(S, it).length) it.balance = v;
    it[f] = v; save(); render();
  },
  sim(el) { const v = parseAmount(el.value); UI.sim[el.dataset.id] = v && v > 0 ? v : 0; render(); },
  stmtPerson(el) { UI.stmtPerson = el.value; },
  csvFile(el) { const f = el.files && el.files[0]; if (!f) return; UI.lastBank = ($('#bankName') || {}).value; readFileText(f, text => startReview(text, f.name)); },
  mapping(el) {
    const r = UI.review; const f = el.dataset.field;
    if (f === 'hasHeader') { r.hasHeader = el.checked; r.header = r.hasHeader ? r.raw[0].map(s => String(s).trim()) : r.raw[0].map((_, i) => 'Column ' + (i + 1)); }
    else if (f === 'dateFormat' || f === 'sign') r.mapping[f] = el.value;
    else r.mapping[f] = el.value === '' ? null : +el.value;
    buildReview(); render();
  },
  rvCat(el) { const e = UI.review.edits[+el.dataset.idx] = UI.review.edits[+el.dataset.idx] || {}; e.category = el.value; e.type = catType(el.value); buildReview(); render(); },
  rvTick(el) { (UI.review.edits[+el.dataset.idx] = UI.review.edits[+el.dataset.idx] || {}).tick = el.checked; buildReview(); render(); },
  txCat(el) { const t = findById(S.transactions, el.dataset.id); if (!t) return; t.category = el.value; t.type = catType(el.value); S.catRev = (S.catRev || 0) + 1; if (el.value !== 'Uncategorized') { const p = patternFromMerchant(t.merchant); if (p) upsertRule(p, el.value); } save(); render(); toast('Rule learned: "' + patternFromMerchant(t.merchant) + '" → ' + el.value); },
  importFile(el) { const f = el.files && el.files[0]; if (!f) return; const mode = UI.importMode === 'replace' ? 'replace' : 'merge'; if (mode === 'replace' && !confirm('Replace ALL current data with this file?')) { el.value = ''; return; } readFileText(f, text => importJsonText(text, mode)); el.value = ''; }
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act],[data-tab],[data-person]'); if (!el) return;
  if (el.dataset.tab) { UI.tab = el.dataset.tab; render(); window.scrollTo(0, 0); return; }
  if (el.dataset.person) { UI.person = el.dataset.person; save(); render(); return; }
  if (ev.target.closest('input,select') && !el.matches('button')) return; // don't treat clicks into inline inputs as row taps
  const fn = Actions[el.dataset.act]; if (fn) { ev.preventDefault(); fn(el, ev); }
});
document.addEventListener('change', ev => {
  const el = ev.target.closest('[data-change]'); if (!el) return;
  const fn = Changes[el.dataset.change]; if (fn) fn(el, ev);
});
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.matches('input[type=text]')) ev.target.blur(); if (ev.key === 'Escape') closeModal(); });
$('#modal').addEventListener('click', ev => { if (ev.target.id === 'modal') closeModal(); });

/* ---------- init ---------- */
(function init() {
  S = load();
  if (!S) { S = blankState(); S.categories = defaultCategories(); save(); }
  else if (S.seeded && !S.seedCleaned) { stripSeed(S); S.seedCleaned = true; save(); setTimeout(() => toast('Example data removed. Start with your own numbers.'), 300); }
  S.seedCleaned = true;
  S.names = S.names || { Armen: 'Armen', Partner: 'Partner' };
  for (const k of ['accounts', 'dismissed']) S[k] = S[k] || [];
  for (const k of ['paydays', 'budgets', 'snapshots']) S[k] = S[k] || {};
  S.whatif = S.whatif || { cuts: {}, extraDebt: 0, incomeDelta: 0 };
  if (!S.startMonth) { const pm = Object.keys(S.payments).sort()[0]; S.startMonth = pm && pm < curMonth() ? pm : curMonth(); }
  UI.person = (S.prefs && S.prefs.person) || 'both';
  UI.month = curMonth();
  render();
})();
</script>
</body>
</html>
