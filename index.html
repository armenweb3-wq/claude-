<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d11">
<meta name="color-scheme" content="dark">
<title>Finance</title>
<style>
:root{
  --bg:#0b0d11;--bg2:#12151b;--card:#161a22;--card2:#1c2130;--line:#262c3a;--line2:#323a4c;
  --text:#e8ebf1;--muted:#8d95a8;--dim:#5d6578;
  --accent:#7c9cff;--accent2:#4f6fe6;--green:#3ecf8e;--red:#ff6b6b;--amber:#f5b64c;--purple:#b48cff;
  --radius:14px;--tap:46px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:calc(76px + var(--sab))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600}
h2{font-size:17px;margin:22px 0 10px;color:var(--text)}
h2 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
h3{font-size:15px}
p{margin:6px 0}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:12px}.xs{font-size:11px}
.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.accent{color:var(--accent)}.purple{color:var(--purple)}
.mono{font-variant-numeric:tabular-nums}
.right{text-align:right}.center{text-align:center}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.gap4{gap:4px}.gap6{gap:6px}.mt6{margin-top:6px}.mt10{margin-top:10px}.mt14{margin-top:14px}.mb10{margin-bottom:10px}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}

/* header */
#top{position:sticky;top:0;z-index:20;background:rgba(11,13,17,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);padding:calc(8px + var(--sat)) 14px 8px}
#top .hbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
#top h1{font-size:19px;letter-spacing:-.01em}
#top h1 span{color:var(--accent)}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:999px;min-height:34px;font-size:13px;font-weight:500}
.seg button.on{background:var(--accent2);color:#fff}
.monthpick{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:8px}
.monthpick button{background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:10px;min-width:44px;min-height:38px;font-size:18px}
.monthpick .lbl{min-width:140px;text-align:center;font-weight:600;font-size:15px}
.monthpick .lbl small{display:block;font-weight:400;color:var(--muted);font-size:11px}

main{padding:10px 14px 20px;max-width:720px;margin:0 auto}

/* bottom nav */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(14,17,23,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + var(--sab))}
#tabs button{flex:1;border:0;background:transparent;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:10.5px;min-height:52px;border-radius:10px}
#tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--accent)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:10px 0}
.card.tight{padding:10px 12px}
.card.flat{background:var(--bg2)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 12px 10px;min-width:0}
.stat .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:21px;font-weight:650;margin-top:2px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .d{font-size:11.5px;margin-top:3px;color:var(--muted);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero{background:linear-gradient(145deg,#1b2238,#141826);border:1px solid var(--line2);border-radius:18px;padding:16px;margin:10px 0}
.hero .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hero .v{font-size:34px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.hero .d{font-size:12.5px;color:var(--muted);margin-top:4px}

/* lists */
.list{margin:0;padding:0;list-style:none}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);min-height:var(--tap)}
.item:last-child{border-bottom:0}
.item .name{font-weight:500}
.item .sub{font-size:12px;color:var(--muted);margin-top:1px}
.item .amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.item.off{opacity:.45}
.item.paid .name{color:var(--muted)}
.chip{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:999px;background:var(--card2);color:var(--muted);border:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.chip.a{color:#9fb6ff;border-color:#37477a}.chip.p{color:#e2b6ff;border-color:#5a3f7a}.chip.s{color:#8ee0b9;border-color:#2f6b4f}
.chip.red{color:var(--red);border-color:#6b3030}.chip.amber{color:var(--amber);border-color:#6b5520}.chip.green{color:var(--green);border-color:#2f6b4f}
.chip.m{color:#f5b64c;border-color:#6b5520}.chip.d{color:#8d95a8}

/* checkbox */
.chk{appearance:none;-webkit-appearance:none;width:28px;height:28px;border-radius:9px;border:2px solid var(--line2);background:var(--bg2);flex:none;position:relative;margin:0}
.chk:checked{background:var(--green);border-color:var(--green)}
.chk:checked::after{content:"";position:absolute;left:8px;top:3px;width:7px;height:13px;border:solid #0b0d11;border-width:0 3px 3px 0;transform:rotate(45deg)}
.chk.big{width:34px;height:34px}.chk.big:checked::after{left:11px;top:5px;width:8px;height:15px}
label.tog{display:flex;align-items:center;gap:8px;min-height:var(--tap);font-size:14px}
.sw{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:var(--line2);position:relative;flex:none;margin:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw:checked{background:var(--green)}.sw:checked::after{left:21px}

/* forms */
input[type=text],input[type=number],input[type=date],input[type=month],select,textarea{
  width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;min-height:var(--tap);color:var(--text);outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input.inline{padding:6px 8px;min-height:38px;width:110px;text-align:right;font-variant-numeric:tabular-nums}
input.inline.sm{width:64px}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
select.inline{padding:6px 28px 6px 8px;min-height:38px;width:auto;font-size:13px}
.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--card2);color:var(--text);border-radius:12px;padding:0 16px;min-height:var(--tap);font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--accent2);border-color:var(--accent2);color:#fff}
.btn.danger{color:var(--red);border-color:#5a2a2a}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.xs{min-height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btnrow .btn{flex:1}

/* progress */
.bar{height:8px;background:var(--bg2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar i.g{background:var(--green)}.bar i.a{background:var(--amber)}.bar i.r{background:var(--red)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em}
th:first-child,td:first-child{text-align:left}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px}

/* review rows */
.rv{padding:10px 0;border-bottom:1px solid var(--line)}
.rv .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rv .merch{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv .ctl{display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap}
.rv.dup{opacity:.55}
.rv.del{display:none}
.match{background:#1e2a24;border:1px solid #2f6b4f;border-radius:10px;padding:8px 10px;margin-top:6px;font-size:12.5px;display:flex;align-items:center;gap:8px}

/* modal sheet */
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
#modal .sheet{background:var(--card);border:1px solid var(--line2);border-radius:20px 20px 0 0;width:100%;max-width:720px;max-height:88vh;overflow:auto;padding:14px 16px calc(20px + var(--sab));
  -webkit-overflow-scrolling:touch;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
#modal .shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#modal .shead h3{font-size:17px}
#modal .x{border:0;background:var(--card2);color:var(--text);border-radius:999px;width:36px;height:36px;font-size:18px}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translateX(-50%) translateY(20px);background:#232a3a;border:1px solid var(--line2);color:var(--text);
  padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}

.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
.leak{border-left:3px solid var(--amber)}
.test{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:flex-start}
.test .ok{color:var(--green);flex:none}.test .fail{color:var(--red);flex:none}
.test .detail{color:var(--muted);font-size:12px;word-break:break-word}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px}
.kv b{font-variant-numeric:tabular-nums;font-weight:600}
.cols{display:flex;gap:10px}
.cols>*{flex:1;min-width:0}
svg.chart{width:100%;height:170px;display:block}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.filetap{display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--line2);border-radius:14px;min-height:72px;color:var(--muted);font-size:14px;position:relative;background:var(--bg2)}
.filetap input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.pill{display:inline-flex;gap:4px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px}
.pill button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:5px 10px;font-size:12px;min-height:30px}
.pill button.on{background:var(--card2);color:var(--text)}
@media (min-width:560px){.grid3{gap:10px}.stat .v{font-size:23px}}
</style>
</head>
<body>
<header id="top">
  <div class="hbar">
    <h1>Fin<span>ance</span></h1>
    <div class="seg" id="personSeg">
      <button data-person="Armen">Armen</button>
      <button data-person="Partner">Partner</button>
      <button data-person="both">Both</button>
    </div>
  </div>
  <div class="monthpick" id="monthpick">
    <button data-act="monthPrev" aria-label="Previous month">‹</button>
    <div class="lbl" data-act="monthToday" id="monthLbl"></div>
    <button data-act="monthNext" aria-label="Next month">›</button>
  </div>
</header>
<main id="app"></main>
<nav id="tabs">
  <button data-tab="dash"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dashboard</button>
  <button data-tab="income"><svg viewBox="0 0 24 24"><path d="M12 3v18M7 8h7a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h8"/></svg>Income</button>
  <button data-tab="fixed"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/><path d="M18 16l2 2 3-3"/></svg>Fixed</button>
  <button data-tab="stmt"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>Statements</button>
  <button data-tab="loans"><svg viewBox="0 0 24 24"><path d="M3 10l9-6 9 6"/><path d="M5 10v9h14v-9"/><path d="M10 19v-5h4v5"/></svg>Loans</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</nav>
<div id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" async onload="window.__chartReady=true;if(window.onChartReady)window.onChartReady()" onerror="window.__chartFailed=true"></script>
<script>
'use strict';
/* =========================================================
   Personal finance — single file. All amounts are integer cents.
   APR is stored in basis points (5.9% = 590). Months are 'YYYY-MM'.
   ========================================================= */
const KEY = 'pfin.v1';
const PEOPLE = ['Armen', 'Partner'];
const OWNERS = ['Armen', 'Partner', 'Shared'];
const SMALL_CHARGE = 1500;        // "small charge" threshold for leak detection (€15)
const MATCH_TOLERANCE_BP = 200;   // ±2% statement ↔ payment matching
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

let S = null;   // persistent state
const UI = { tab: 'dash', person: 'both', month: null, review: null, stmtPerson: 'Armen', txFilter: 'all', sim: {}, tests: null, showHistoryFor: null };
function N(p) { return (S && S.names && S.names[p]) || p; }   // display name for a person key
function weekday(iso) { return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date(iso + 'T12:00:00').getDay()]; }

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
let _uidCounter = 0;
function uid() { return Date.now().toString(36) + (_uidCounter++).toString(36) + Math.random().toString(36).slice(2, 6); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function pad(n) { return String(n).padStart(2, '0'); }
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function curMonth() { return todayISO().slice(0, 7); }
function addMonths(m, n) { let [y, mo] = m.split('-').map(Number); mo += n; y += Math.floor((mo - 1) / 12); mo = ((mo - 1) % 12 + 12) % 12 + 1; return y + '-' + pad(mo); }
function monthDiff(a, b) { const [ay, am] = a.split('-').map(Number), [by, bm] = b.split('-').map(Number); return (by - ay) * 12 + (bm - am); }
function monthLabel(m) { if (!m) return ''; const [y, mo] = m.split('-').map(Number); return MONTHS[mo - 1] + ' ' + y; }
function monthShort(m) { const [y, mo] = m.split('-').map(Number); return MONTHS[mo - 1] + (mo === 1 ? ' ' + String(y).slice(2) : ''); }
function daysInMonth(m) { const [y, mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); }
function fmtDate(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-'); return +d + ' ' + MONTHS[+m - 1] + ' ' + y; }
function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
function sum(arr, f) { let t = 0; for (const x of arr) t += f ? f(x) : x; return t; }
function by(arr, f) { const o = {}; for (const x of arr) { const k = f(x); (o[k] = o[k] || []).push(x); } return o; }
function pct(part, whole) { return whole > 0 ? Math.round(part * 1000 / whole) / 10 : 0; }
function bpStr(bp) { return (bp / 100).toFixed(1).replace(/\.0$/, '') + '%'; }

/* ---------- money ---------- */
const _eur = new Intl.NumberFormat('en-IE', { style: 'currency', currency: 'EUR' });
function fmt(c) { c = c || 0; const s = _eur.format(Math.abs(c) / 100); return (c < 0 ? '−' : '') + s; }
function fmtS(c) { return (c > 0 ? '+' : '') + fmt(c); }
function fmtK(c) { const a = Math.abs(c) / 100; const s = a >= 10000 ? (a / 1000).toFixed(1) + 'k' : a >= 1000 ? (a / 1000).toFixed(2).replace(/0$/, '') + 'k' : Math.round(a); return (c < 0 ? '−' : '') + '€' + s; }
function centsIn(c) { return c == null ? '' : (c / 100).toFixed(2); }
/* Parse "1.234,56", "1,234.56", "-12,50", "(12.50)", "€ 1 234,00", "12.50-" → integer cents. Exact (string based). */
function parseAmount(raw) {
  if (raw == null) return null;
  let s = String(raw).trim(); if (!s) return null;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  s = s.replace(/[€$£\s ]/g, '').replace(/EUR/ig, '');
  if (s.endsWith('-')) { neg = !neg; s = s.slice(0, -1); }
  if (s.startsWith('-')) { neg = !neg; s = s.slice(1); } else if (s.startsWith('+')) s = s.slice(1);
  if (s.startsWith('-')) { neg = !neg; s = s.slice(1); }
  s = s.replace(/'/g, '');
  if (!/^[\d.,]+$/.test(s) || !/\d/.test(s)) return null;
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  let decSep = null;
  if (lc >= 0 && ld >= 0) decSep = lc > ld ? ',' : '.';
  else if (lc >= 0) { decSep = (s.length - lc - 1 <= 2 && s.indexOf(',') === lc) ? ',' : null; }

/* =========================================================
   CALCULATIONS — pure functions over a state-like object `st`
   ========================================================= */
const Calc = {
  share(owner, person) { if (person === 'both') return 1; if (owner === 'Shared') return 0.5; return owner === person ? 1 : 0; },
  applyShare(cents, sh) { return sh === 1 ? cents : sh === 0 ? 0 : Math.round(cents * sh); },
  monthlyShare(fc) { return fc.frequency === 'yearly' ? Math.round(fc.amount / 12) : fc.amount; },
  personList(person) { return person === 'both' ? PEOPLE.slice() : [person]; },

  /* The month's own entry, or salary/other carried forward from the latest earlier month (up to 12 back)

  incomeEntry(st, month, person) {
    const own = ((st.income || {})[month] || {})[person];
    if (own && (own.salary || own.other || own.explicit)) return { salary: own.salary || 0, other: own.other || 0, commissions: own.commissions || [], carriedFrom: null };
    for (let n = 1; n <= 12; n++) {

    }

  netIncomeFor(st, month, person) {

  /* every active fixed cost + loan for the month, with payment record and share applied */

  monthTotals(st, month, person, today) {

    if (f.day >= 7 && f.daysLeft > 0 && tp.discretionary > 0 && f.projectedDiscretionary * 100 < tp.discretionary * 90) out.push({ level: 'green', text: 'Discretionary on pace for ' + fmt(f.projectedDiscretionary) + ', ' + pct(tp.discretionary - f.projectedDiscretionary, tp.discretionary) + '% below last month' });

    for (const c of st.categories || []) for (const k of c.keywords || []) { const kk = k.toLowerCase().trim(); if (kk && (nm.includes(kk) || low.includes(kk)) && (!best || kk.length > best.len)) best = { category: c.name, len: kk.length }; }

    return { category: 'Uncategorized', via: 'none' };
  },

  goalStats(goal, today) {
    today = today || todayISO();
    const saved = goal.saved || 0, target = goal.target || 0;
    const left = Math.max(0, target - saved);
    const months = goal.date ? Math.max(0, monthDiff(today.slice(0, 7), goal.date.slice(0, 7))) : 0;
    const perMonth = months > 0 ? Math.ceil(left / months) : left;
    return { saved, target, left, months, perMonth, pctBp: target > 0 ? Math.round(clamp(saved * 10000 / target, 0, 10000)) : 0 };
  }
};

/* =========================================================
   PAYMENTS (per month, per item)
   ========================================================= */
function setPaid(st, month, kind, item, paid, amount, date) {
  st.payments[month] = st.payments[month] || {};
  const prev = st.payments[month][item.id];
  if (kind === 'loan' && prev && prev.paid && prev.principal) item.balance += prev.principal; // undo previous tick
  if (paid) {
    const planned = kind === 'loan' ? item.payment : Calc.monthlyShare(item);
    const amt = amount != null ? amount : planned;
    const rec = { paid: true, paidDate: date || todayISO(), amount: amt };
    if (prev && prev.txId) rec.txId = prev.txId;
    if (kind === 'loan') { const sp = Calc.loanSplit(item.balance, item.apr, amt); rec.interest = sp.interest; rec.principal = sp.principal; item.balance -= sp.principal; }
    st.payments[month][item.id] = rec;
  } else {
    delete st.payments[month][item.id];
    if (!Object.keys(st.payments[month]).length) delete st.payments[month];
  }
}
function paymentHistory(st, item) {
  return Object.keys(st.payments).filter(m => st.payments[m][item.id] && st.payments[m][item.id].paid).sort().reverse().map(m => ({ month: m, rec: st.payments[m][item.id] }));
}

function svgTrend(d) {
  const W = 340, H = 170, padL = 34, padB = 20, padT = 8;
  const series = [['net', '#7c9cff'], ['mandatory', '#f5b64c'], ['discretionary', '#b48cff'], ['leftover', '#3ecf8e']];
  let max = 1, min = 0; for (const x of d) for (const [k] of series) { max = Math.max(max, x[k]); min = Math.min(min, x[k]); }
  const span = max - min || 1; const plotH = H - padB - padT;
  const y = v => padT + (max - v) / span * plotH;
  const gw = (W - padL) / d.length, bw = Math.max(3, (gw - 8) / series.length);
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="6-month trend">';
  const steps = 3; for (let i = 0; i <= steps; i++) { const v = min + span * i / steps; const yy = y(v); s += '<line x1="' + padL + '" x2="' + W + '" y1="' + yy.toFixed(1) + '" y2="' + yy.toFixed(1) + '" stroke="#262c3a" stroke-width="1"/><text x="' + (padL - 4) + '" y="' + (yy + 3).toFixed(1) + '" fill="#8d95a8" font-size="8" text-anchor="end">' + fmtK(Math.round(v)) + '</text>'; }
  d.forEach((x, i) => {
    const gx = padL + i * gw + 4;
    series.forEach(([k, col], j) => { const v = x[k]; const y0 = y(0), y1 = y(v); s += '<rect x="' + (gx + j * bw).toFixed(1) + '" y="' + Math.min(y0, y1).toFixed(1) + '" width="' + (bw - 1).toFixed(1) + '" height="' + Math.max(1, Math.abs(y0 - y1)).toFixed(1) + '" rx="1.5" fill="' + col + '"><title>' + esc(monthShort(x.month)) + ' ' + k + ': ' + fmt(v) + '</title></rect>'; });
    s += '<text x="' + (gx + gw / 2 - 4).toFixed(1) + '" y="' + (H - 6) + '" fill="#8d95a8" font-size="9" text-anchor="middle">' + esc(monthShort(x.month)) + '</text>';
  });
  if (min < 0) s += '<line x1="' + padL + '" x2="' + W + '" y1="' + y(0).toFixed(1) + '" y2="' + y(0).toFixed(1) + '" stroke="#5d6578" stroke-width="1"/>';
  return s + '</svg>';
}

function looksLikeHeader(row) {
  let text = 0; for (const c of row) { const s = String(c).trim(); if (s && parseAmount(s) == null && !parseDate(s)) text++; }
  return text >= Math.max(1, Math.ceil(row.length / 2));
}
function detectMapping(raw) {
  const hasHeader = raw.length > 1 && looksLikeHeader(raw[0]);
  const header = hasHeader ? raw[0].map(s => String(s).trim()) : raw[0].map((_, i) => 'Column ' + (i + 1));
  const body = (hasHeader ? raw.slice(1) : raw).slice(0, 50);
  const n = header.length; const score = [];
  for (let c = 0; c < n; c++) {
    let dates = 0, amts = 0, texts = 0, len = 0, negs = 0, nonEmpty = 0;
    for (const r of body) { const v = String(r[c] == null ? '' : r[c]).trim(); if (!v) continue; nonEmpty++; if (parseDate(v)) dates++; const a = parseAmount(v); if (a != null) { amts++; if (a < 0) negs++; } else if (!parseDate(v)) { texts++; len += v.length; } }
    const hn = header[c].toLowerCase();
    score.push({ c, date: dates / (nonEmpty || 1) + (/date|datum|fecha|data|ημερ|дата|booking|valuta|posted/.test(hn) ? 1 : 0),
      amount: (amts - dates) / (nonEmpty || 1) + (/amount|betrag|importe|montant|ποσό|сумма|value|sum|debit|credit|withdraw|deposit/.test(hn) ? 1 : 0) + (negs ? .2 : 0) + (/credit|deposit/.test(hn) ? -.5 : 0),
      merchant: texts / (nonEmpty || 1) + Math.min(len / (nonEmpty || 1) / 40, .9) + (/desc|merchant|payee|name|narrat|detail|memo|benef|text|particular|reference|counterpart|concept/.test(hn) ? 1 : 0),
      credit: (amts / (nonEmpty || 1)) + (/credit|deposit|einnahme|haben|ingreso/.test(hn) ? 2 : -1) });
  }
  const pick = (k, used) => { let best = null; for (const s of score) { if (used.includes(s.c)) continue; if (!best || s[k] > best[k]) best = s; } return best && best[k] > 0.3 ? best.c : null; };
  const used = [];
  const date = pick('date', used); if (date != null) used.push(date);
  const amount = pick('amount', used); if (amount != null) used.push(amount);
  const merchant = pick('merchant', used); if (merchant != null) used.push(merchant);
  let credit = null; const cr = score.filter(s => !used.includes(s.c) && s.credit > 1.5).sort((a, b) => b.credit - a.credit)[0];
  if (cr && /debit|withdraw|soll|ausgabe/.test(header[amount == null ? -1 : amount].toLowerCase())) credit = cr.c;
  return { hasHeader, header, mapping: { date: date == null ? 0 : date, amount: amount == null ? Math.min(1, n - 1) : amount, merchant: merchant == null ? Math.min(2, n - 1) : merchant, credit: credit, dateFormat: 'auto', sign: 'auto' } };
}
function startReview(text, filename) {
  const raw = parseCSV(text);
  if (!raw.length || raw[0].length < 2) { toast('Could not read any rows from that CSV'); return; }
  const bank = ($('#bankName') && $('#bankName').value.trim()) || 'Bank';
  const det = detectMapping(raw);
  const saved = S.bankMappings[bank];
  const mapping = saved && saved.header && saved.header.join('|') === det.header.join('|') ? Object.assign({}, det.mapping, saved) : det.mapping;
  UI.review = { raw, filename, bank, person: UI.stmtPerson, hasHeader: det.hasHeader, header: det.header, mapping, edits: {}, items: [] };
  buildReview();

function nameOverlap(merchant, name) {
  const a = new Set(normMerchant(merchant).split(' ').filter(w => w.length >= 3));
  return normMerchant(name).split(' ').some(w => w.length >= 3 && a.has(w));
}
function buildReview() {
  const r = UI.review; const map = r.mapping; const rows = r.hasHeader ? r.raw.slice(1) : r.raw;
  const existing = new Set(S.transactions.map(dupKey)); const seen = new Set();
  const parsed = rows.map((row, idx) => {
    const date = parseDate(row[map.date], map.dateFormat === 'auto' ? null : map.dateFormat);
    let amount = parseAmount(row[map.amount]);
    if (map.credit != null && map.credit !== '' && map.credit !== map.amount) { const cr = parseAmount(row[map.credit]); if (amount == null || amount === 0) amount = cr != null && cr !== 0 ? -Math.abs(cr) : amount; else amount = Math.abs(amount); }

    if (k) seen.add(k);
    base.credit = valid && amount <= 0;
    base.skip = e.skip != null ? e.skip : base.credit;   // credits/refunds are skipped unless included
    const match = valid && amount > 0 && !base.dup ? Calc.matchPayment(S, base) : null;
    base.match = match && !match.paid ? match : null;
    base.nameHit = !!(base.match && nameOverlap(x.merchant, base.match.name));
    base.tick = e.tick != null ? e.tick : base.nameHit;   // only auto-tick when the merchant text also matches the item name
    return base;
  });
}

function saveReview() {
  const r = UI.review; if (!r) return;
  const stmt = { id: uid(), bank: r.bank, filename: r.filename, importedAt: new Date().toISOString(), count: 0, person: r.person, ticked: 0 };
  const newRules = {};
  for (const i of r.items) {
    if (i.deleted || i.skip || !i.valid) continue;
    const tx = { id: uid(), person: r.person, date: i.date, merchant: i.merchant, amount: i.amount, category: i.category, type: i.type, statementId: stmt.id, duplicate: !!i.dup };
    if (i.match && i.tick && !i.dup) {
      const coll = i.match.kind === 'loan' ? S.loans : S.fixedCosts; const item = findById(coll, i.match.id);
      if (item) { setPaid(S, i.date.slice(0, 7), i.match.kind, item, true, i.amount, i.date); S.payments[i.date.slice(0, 7)][item.id].txId = tx.id; tx.linkedTo = item.id; stmt.ticked++; }
    }
    if (i.category !== i.autoCategory && i.category !== 'Uncategorized') { const p = patternFromMerchant(i.merchant); if (p) newRules[p] = i.category; }
    S.transactions.push(tx); stmt.count++;
  }
  for (const p of Object.keys(newRules)) upsertRule(p, newRules[p]);
  S.statements.push(stmt);
  S.bankMappings[r.bank] = Object.assign({}, r.mapping, { header: r.header, hasHeader: r.hasHeader });
  UI.lastBank = r.bank;
  UI.review = null;
  save(); render();
  toast('Saved ' + stmt.count + ' transactions' + (Object.keys(newRules).length ? ' · learned ' + Object.keys(newRules).length + ' rule(s)' : '') + (stmt.ticked ? ' · ticked ' + stmt.ticked + ' payment(s)' : ''));
}
function upsertRule(pattern, category) {
  pattern = pattern.toLowerCase().trim(); if (!pattern) return;
  const ex = S.rules.find(x => x.pattern.toLowerCase() === pattern);
  if (ex) ex.category = category; else S.rules.push({ id: uid(), pattern, category });
}
function readFileText(file, cb) {
  const fr = new FileReader();
  fr.onload = () => cb(String(fr.result || ''));
  fr.onerror = () => toast('Could not read file');
  fr.readAsText(file);
}

function mergeState(a, b) {
  const ids = coll => new Set((a[coll] || []).map(x => x.id));
  for (const coll of ['fixedCosts', 'loans', 'transactions', 'rules', 'goals', 'statements']) { const have = ids(coll); for (const x of b[coll] || []) if (x && x.id && !have.has(x.id)) a[coll].push(x); }
  const catNames = new Set(a.categories.map(c => c.name)); for (const c of b.categories || []) if (c && !catNames.has(c.name)) a.categories.push(c);
  for (const m of Object.keys(b.income || {})) { a.income[m] = a.income[m] || {}; for (const p of Object.keys(b.income[m])) { if (!a.income[m][p]) a.income[m][p] = b.income[m][p]; else { const have = new Set((a.income[m][p].commissions || []).map(c => c.id)); for (const c of b.income[m][p].commissions || []) if (!have.has(c.id)) a.income[m][p].commissions.push(c); } } }
  for (const m of Object.keys(b.payments || {})) { a.payments[m] = a.payments[m] || {}; for (const id of Object.keys(b.payments[m])) if (!a.payments[m][id]) a.payments[m][id] = b.payments[m][id]; }
  Object.assign(a.bankMappings, b.bankMappings || {});
  return a;
}
function importJsonText(text, mode) {
  let o; try { o = JSON.parse(text); } catch (e) { toast('Not valid JSON'); return false; }
  if (!o || typeof o !== 'object' || !Array.isArray(o.fixedCosts)) { toast('That file is not a Finance export'); return false; }
  if (mode === 'replace') S = Object.assign(blankState(), o);
  else mergeState(S, o);
  S.version = 1; save(); render(); toast('Imported (' + mode + ')'); return true;
}

function runSelfTests() {
  const T = []; const eq = (name, got, want) => T.push({ name, ok: JSON.stringify(got) === JSON.stringify(want), detail: 'got ' + JSON.stringify(got) + ', expected ' + JSON.stringify(want) });
  const near = (name, got, want, tol) => T.push({ name, ok: Math.abs(got - want) <= tol, detail: 'got ' + got + ', expected ' + want + ' ±' + tol });
  const ok = (name, cond, detail) => T.push({ name, ok: !!cond, detail: detail || '' });
  const today = '2026-10-15', M = '2026-10';
  // parsing
  eq('parseAmount: 1.234,56 → 123456', parseAmount('1.234,56'), 123456);
  eq('parseAmount: 1,234.56 → 123456', parseAmount('1,234.56'), 123456);
  eq('parseAmount: -12,50 → -1250', parseAmount('-12,50'), -1250);
  eq('parseAmount: (12.50) → -1250', parseAmount('(12.50)'), -1250);
  eq('parseAmount: "€ 1 234,00" → 123400', parseAmount('€ 1 234,00'), 123400);
  eq('parseAmount: 0.29 → 29 (no float drift)', parseAmount('0.29'), 29);
  eq('parseAmount: 12.50- → -1250', parseAmount('12.50-'), -1250);
  eq('parseAmount: text → null', parseAmount('abc'), null);
  eq('parseDate: 2026-10-03', parseDate('2026-10-03'), '2026-10-03');
  eq('parseDate: 03/10/2026 (DMY default)', parseDate('03/10/2026'), '2026-10-03');
  eq('parseDate: 10/03/2026 MDY hint', parseDate('10/03/2026', 'MDY'), '2026-10-03');
  eq('parseDate: 25.12.26', parseDate('25.12.26'), '2026-12-25');
  eq('parseDate: 3 Oct 2026', parseDate('3 Oct 2026'), '2026-10-03');
  eq('parseDate: invalid 31/02/2026 → null', parseDate('31/02/2026'), null);
  eq('parseCSV: quoted field with comma and ""', parseCSV('a,b\n"x, ""y""",2\n'), [['a', 'b'], ['x, "y"', '2']]);
  eq('parseCSV: semicolon delimiter auto-detected', parseCSV('d;a;m\n01.10.2026;-5,00;Lidl'), [['d', 'a', 'm'], ['01.10.2026', '-5,00', 'Lidl']]);
  eq('addMonths wraps year', [addMonths('2026-12', 1), addMonths('2026-01', -1), addMonths('2026-10', -13)], ['2027-01', '2025-12', '2025-09']);
  eq('monthDiff', monthDiff('2025-11', '2026-10'), 11);
  // shares
  eq('monthlyShare: yearly 600.00 → 50.00', Calc.monthlyShare({ amount: 60000, frequency: 'yearly' }), 5000);
  eq('monthlyShare: yearly 100.00 → 8.33', Calc.monthlyShare({ amount: 10000, frequency: 'yearly' }), 833);
  eq('share: Shared counts ½ for one person, full for Both', [Calc.share('Shared', 'Armen'), Calc.share('Shared', 'both'), Calc.share('Partner', 'Armen')], [0.5, 1, 0]);
  // totals
  const st = fixtureState();
  eq('netIncome Armen = salary+commissions+other', Calc.netIncome(st, M, 'Armen').net, 300000);
  eq('netIncome Both', Calc.netIncome(st, M, 'both').net, 500000);
  const tb = Calc.monthTotals(st, M, 'both', today);
  eq('mandatory (Both) = rent + gym + ins/12 + loan + mandatory tx', tb.mandatory, 120000 + 4000 + 5000 + 30000 + 5000);
  eq('discretionary (Both) excludes duplicates', tb.discretionary, 2850);
  eq('leftover = net − mandatory − discretionary', tb.leftover, 500000 - 164000 - 2850);
  eq('savings rate bp = round(leftover/net)', tb.savingsRateBp, Math.round((500000 - 164000 - 2850) * 10000 / 500000));
  eq('paid so far (Both) = rent', tb.paid, 120000);

    { id: 'fc-gym', name: 'Gym', amount: 4500, category: 'Health', owner: 'Armen', frequency: 'monthly', active: true, mandatory: false, dueDay: 20 },
    { id: 'fc-netflix', name: 'Netflix', amount: 1299, category: 'Subscriptions', owner: 'Shared', frequency: 'monthly', active: true, mandatory: false, dueDay: 22 },
    { id: 'fc-spotify', name: 'Spotify Duo', amount: 1499, category: 'Subscriptions', owner: 'Shared', frequency: 'monthly', active: true, mandatory: false, dueDay: 9 },
    { id: 'fc-icloud', name: 'iCloud 200GB', amount: 299, category: 'Subscriptions', owner: 'Partner', frequency: 'monthly', active: true, mandatory: false, dueDay: 27 },
    { id: 'fc-old', name: 'Old gym (cancelled)', amount: 3900, category: 'Health', owner: 'Partner', frequency: 'monthly', active: false, mandatory: false, dueDay: 1 }];
  st.loans = [
    { id: 'loan-car', name: 'Car loan', owner: 'Armen', principal: 1800000, balance: 1012345, apr: 590, payment: 34500, startDate: '2024-03-01', term: 60, dueDay: 10 },
    { id: 'loan-pers', name: 'Personal loan', owner: 'Partner', principal: 500000, balance: 187600, apr: 790, payment: 15700, startDate: '2025-02-01', term: 36, dueDay: 25 }];
  st.goals = [{ id: 'goal-1', name: 'Holiday fund', target: 300000, saved: 115000, date: addMonths(curMonth(), 8) + '-01' }, { id: 'goal-2', name: 'Emergency fund', target: 1000000, saved: 420000, date: addMonths(curMonth(), 20) + '-01' }];
  const cm = curMonth();
  const merchants = [
    ['LIDL NICOSIA', 'Groceries', [2500, 9000], 5], ['ALPHAMEGA ENGOMI', 'Groceries', [3000, 12000], 3], ['SHELL STROVOLOS', 'Transport', [4000, 7500], 2],
    ['WOLT', 'Eating out', [1200, 3200], 4], ['COFFEE ISLAND', 'Eating out', [280, 520], 9], ['STARBUCKS MALL', 'Eating out', [450, 700], 2],
    ['PHARMACY ELPIS', 'Health', [600, 2500], 1], ['ZARA NICOSIA', 'Shopping', [2500, 9000], 1], ['AMAZON.DE', 'Shopping', [1500, 6000], 1],
    ['BOLT RIDE', 'Transport', [500, 1400], 2], ['SOUVLAKI HOUSE', 'Eating out', [1500, 3500], 1], ['K CINEPLEX', 'Entertainment', [900, 2400], 1]];
  for (let n = 5; n >= 0; n--) {
    const m = addMonths(cm, -n); const dim = daysInMonth(m);
    st.income[m] = { Armen: { salary: 285000, other: n === 2 ? 15000 : 0, commissions: [] }, Partner: { salary: 210000, other: 0, commissions: [] } };
    const nComm = ri(0, 2); for (let i = 0; i < nComm; i++) st.income[m].Armen.commissions.push({ id: 'comm-' + m + '-' + i, amount: ri(20, 120) * 1000, note: ['Client A deal', 'Referral', 'Q bonus'][i % 3], date: m + '-' + pad(ri(3, 26)) });
    if (n === 1) st.income[m].Partner.commissions.push({ id: 'comm-p-' + m, amount: 35000, note: 'Freelance project' });
    // transactions
    const stmtId = 'stmt-' + m; let count = 0;
    for (const [name, cat, [lo, hi], perMonth] of merchants) {
      const k = n === 0 ? Math.ceil(perMonth * 0.6) : perMonth + (name === 'LIDL NICOSIA' && n === 1 ? 3 : 0);
      for (let i = 0; i < k; i++) { const person = cat === 'Shopping' || name === 'COFFEE ISLAND' ? 'Partner' : (rnd() < 0.7 ? 'Armen' : 'Partner'); const day = Math.min(dim, n === 0 ? ri(1, Math.max(1, +todayISO().slice(8, 10))) : ri(1, dim)); st.transactions.push({ id: 'tx-' + m + '-' + (count++), person, date: m + '-' + pad(day), merchant: name, amount: ri(lo, hi), category: cat, type: (st.categories.find(c => c.name === cat) || {}).type === 'mandatory' ? 'mandatory' : 'discretionary', statementId: stmtId, duplicate: false }); }
    }
    if (n === 2) { const t = st.transactions[st.transactions.length - 1]; st.transactions.push(Object.assign({}, t, { id: t.id + '-dup', duplicate: true })); }
    st.statements.push({ id: stmtId, bank: 'Bank of Cyprus', filename: 'statement-' + m + '.csv', importedAt: new Date(m + '-28T10:00:00').toISOString(), count, person: 'Armen' });
    // payments: all past months fully paid; current month partially
    st.payments[m] = {};
    for (const fc of st.fixedCosts) { if (fc.active === false) continue; const dueDay = fc.dueDay || 1; const paidPast = n > 0; const paidNow = n === 0 && dueDay <= 8; if (paidPast || paidNow) st.payments[m][fc.id] = { paid: true, paidDate: m + '-' + pad(Math.min(dim, dueDay)), amount: Calc.monthlyShare(fc) + (fc.id === 'fc-eac' ? ri(-2000, 2500) : 0) }; }
    for (const l of st.loans) { if (n > 0 || (n === 0 && l.dueDay <= 2)) { const sp = Calc.loanSplit(l.balance + 0, l.apr, l.payment); st.payments[m][l.id] = { paid: true, paidDate: m + '-' + pad(Math.min(dim, l.dueDay)), amount: l.payment, interest: sp.interest, principal: sp.principal }; } }
  }
  st.bankMappings['Bank of Cyprus'] = { date: 0, amount: 2, merchant: 1, credit: null, dateFormat: 'DMY', sign: 'auto', header: ['Date', 'Description', 'Amount'], hasHeader: true };
  st.transactions.sort((a, b) => a.date.localeCompare(b.date));
  return st;
}

  },
  // settings
  exportJson() { exportJson(); },
  copyExport() { const ta = $('#exportText'); ta.select(); try { document.execCommand('copy'); toast('Copied'); } catch (e) { toast('Select and copy manually'); } },
  importMode(el) { UI.importMode = el.dataset.v; render(); },
  clearSeed() { if (!confirm('Remove all example data? Categories are kept.')) return; stripSeed(S); save(); render(); toast('Example data cleared'); },
  resetAll() { if (!confirm('Delete ALL data in this app? Export first if unsure.')) return; S = blankState(); S.categories = defaultCategories(); save(); render(); toast('Reset'); },
  addCat() { const c = { id: uid(), name: 'New category', type: 'discretionary', keywords: [] }; S.categories.push(c); save(); render(); editCatModal(c.id); },
  editCat(el) { editCatModal(el.dataset.id); },
  delCat(el) { const c = findById(S.categories, el.dataset.id); if (!c || !confirm('Delete category "' + c.name + '"? Transactions keep the name.')) return; S.categories = S.categories.filter(x => x.id !== c.id); closeModal(); save(); render(); },
  addRule() { S.rules.push({ id: uid(), pattern: '', category: S.categories[0] ? S.categories[0].name : 'Other' }); save(); render(); },
  delRule(el) { S.rules = S.rules.filter(r => r.id !== el.dataset.id); save(); render(); },
  addGoal() { const g = { id: uid(), name: 'New goal', target: 100000, saved: 0, date: addMonths(curMonth(), 12) + '-01' }; S.goals.push(g); save(); render(); editGoalModal(g.id); },
  editGoal(el) { editGoalModal(el.dataset.id); },
  delGoal(el) { S.goals = S.goals.filter(g => g.id !== el.dataset.id); closeModal(); save(); render(); },
  runTests() { UI.tests = runSelfTests(); render(); const ok = UI.tests.filter(t => t.ok).length; toast(ok + '/' + UI.tests.length + ' self-tests passed'); }
};

const Changes = {
  togglePaid(el) {
    const item = itemFor(el.dataset.kind, el.dataset.id); if (!item) return;
    setPaid(S, UI.month, el.dataset.kind, item, el.checked, null, UI.month === curMonth() ? todayISO() : UI.month + '-' + pad(Math.min(daysInMonth(UI.month), item.dueDay || 1)));
    save(); render();
    if (el.dataset.modal) (el.dataset.kind === 'loan' ? editLoanModal : editFixedModal)(item.id);
  },
  paidField(el) {
    const item = itemFor(el.dataset.kind, el.dataset.id); const rec = (S.payments[UI.month] || {})[item.id]; if (!item || !rec) return;
    if (el.dataset.field === 'paidDate') { rec.paidDate = el.value || rec.paidDate; }
    else { const amt = parseAmount(el.value); if (amt == null) { toast('Invalid amount'); return; } setPaid(S, UI.month, el.dataset.kind, item, true, amt, rec.paidDate); }
    save(); render(); (el.dataset.kind === 'loan' ? editLoanModal : editFixedModal)(item.id);
  },
  income(el) {
    const v = parseAmount(el.value); if (v == null) { toast('Invalid amount'); render(); return; }
    const inc = incomeOf(UI.month, el.dataset.person); const cur = Calc.incomeEntry(S, UI.month, el.dataset.person);
    if (cur.carriedFrom) { inc.salary = cur.salary; inc.other = cur.other; }
    inc[el.dataset.field] = v; inc.explicit = true; save(); render();
  },
  commission(el) { const c = findById(incomeOf(UI.month, el.dataset.person).commissions, el.dataset.id); if (!c) return; if (el.dataset.field === 'amount') { const v = parseAmount(el.value); if (v == null) { toast('Invalid amount'); render(); return; } c.amount = v; } else if (el.dataset.field === 'date') c.date = el.value; else c.note = el.value; save(); render(); },
  personName(el) { S.names = S.names || {}; S.names[el.dataset.person] = el.value.trim() || el.dataset.person; save(); render(); },
  field(el) {
    const coll = S[el.dataset.coll]; const it = findById(coll, el.dataset.id); if (!it) return;
    const f = el.dataset.field, t = el.dataset.type || 'text'; let v;
    if (t === 'cents' || t === 'bp') { v = parseAmount(el.value); if (v == null) { toast('Invalid number'); el.value = centsIn(it[f]); return; } if (f !== 'balance' && v < 0) v = -v; }
    else if (t === 'int') { v = parseInt(el.value, 10); if (isNaN(v)) { toast('Invalid number'); return; } if (f === 'dueDay') v = clamp(v, 1, 31); }
    else if (t === 'bool') v = el.checked;
    else if (t === 'list') v = el.value.split(',').map(s => s.trim()).filter(Boolean);
    else v = el.value;
    if ((f === 'startMonth' || f === 'endMonth') && v && !/^\d{4}-\d{2}$/.test(v)) { toast('Use a month like 2026-11'); return; }
    if (el.dataset.coll === 'categories' && f === 'name' && v !== it.name) { const old = it.name; v = v.trim() || old; for (const x of S.transactions) if (x.category === old) x.category = v; for (const x of S.fixedCosts) if (x.category === old) x.category = v; for (const x of S.rules) if (x.category === old) x.category = v; }
    if (el.dataset.coll === 'loans' && f === 'principal' && it.balance === 0 && !paymentHistory(S, it).length) it.balance = v;
    it[f] = v; save(); render();
  },
  sim(el) { const v = parseAmount(el.value); UI.sim[el.dataset.id] = v && v > 0 ? v : 0; render(); },
  stmtPerson(el) { UI.stmtPerson = el.value; },
  csvFile(el) { const f = el.files && el.files[0]; if (!f) return; UI.lastBank = ($('#bankName') || {}).value; readFileText(f, text => startReview(text, f.name)); },
  mapping(el) {
    const r = UI.review; const f = el.dataset.field;
    if (f === 'hasHeader') { r.hasHeader = el.checked; r.header = r.hasHeader ? r.raw[0].map(s => String(s).trim()) : r.raw[0].map((_, i) => 'Column ' + (i + 1)); }
    else if (f === 'dateFormat' || f === 'sign') r.mapping[f] = el.value;
    else r.mapping[f] = el.value === '' ? null : +el.value;
    buildReview(); render();
  },
  rvCat(el) { const e = UI.review.edits[+el.dataset.idx] = UI.review.edits[+el.dataset.idx] || {}; e.category = el.value; e.type = catType(el.value); buildReview(); render(); },
  rvTick(el) { (UI.review.edits[+el.dataset.idx] = UI.review.edits[+el.dataset.idx] || {}).tick = el.checked; buildReview(); render(); },
  txCat(el) { const t = findById(S.transactions, el.dataset.id); if (!t) return; t.category = el.value; t.type = catType(el.value); if (el.value !== 'Uncategorized') { const p = patternFromMerchant(t.merchant); if (p) upsertRule(p, el.value); } save(); render(); toast('Rule learned: "' + patternFromMerchant(t.merchant) + '" → ' + el.value); },
  importFile(el) { const f = el.files && el.files[0]; if (!f) return; const mode = UI.importMode === 'replace' ? 'replace' : 'merge'; if (mode === 'replace' && !confirm('Replace ALL current data with this file?')) { el.value = ''; return; } readFileText(f, text => importJsonText(text, mode)); el.value = ''; }
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act],[data-tab],[data-person]'); if (!el) return;
  if (el.dataset.tab) { UI.tab = el.dataset.tab; render(); window.scrollTo(0, 0); return; }
  if (el.dataset.person) { UI.person = el.dataset.person; save(); render(); return; }
  if (ev.target.closest('input,select') && !el.matches('button')) return; // don't treat clicks into inline inputs as row taps
  const fn = Actions[el.dataset.act]; if (fn) { ev.preventDefault(); fn(el, ev); }
});
document.addEventListener('change', ev => {
  const el = ev.target.closest('[data-change]'); if (!el) return;
  const fn = Changes[el.dataset.change]; if (fn) fn(el, ev);
});
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.matches('input[type=text]')) ev.target.blur(); if (ev.key === 'Escape') closeModal(); });
$('#modal').addEventListener('click', ev => { if (ev.target.id === 'modal') closeModal(); });

/* ---------- init ---------- */
(function init() {
  S = load();
  if (!S) { S = blankState(); S.categories = defaultCategories(); save(); }
  else if (S.seeded && !S.seedCleaned) { stripSeed(S); S.seedCleaned = true; save(); setTimeout(() => toast('Example data removed. Start with your own numbers.'), 300); }
  S.seedCleaned = true;
  S.names = S.names || { Armen: 'Armen', Partner: 'Partner' };
  UI.person = (S.prefs && S.prefs.person) || 'both';
  UI.month = curMonth();
  render();
})();
</script>
</body>
</html>
